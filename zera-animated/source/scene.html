<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Hand"; src: url("/node_modules/@fontsource/patrick-hand/files/patrick-hand-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 900; src: url("/node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2") format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 800; src: url("/node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2") format("woff2"); }
html, body { margin: 0; background: #000; overflow: hidden; }

canvas#c { position: absolute; left: 0; top: 0; width: 720px; height: 1280px; display: block; }
#vig { position: absolute; inset: 0; pointer-events: none;

#tint { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
#cap { position: absolute; left: 0; right: 0; top: 1004px; text-align: center; pointer-events: none; }
#cap span.pill { display: inline-block; padding: 12px 26px 14px; border-radius: 22px;
  background: rgba(18,14,24,0.92); color: #fff; font: 900 46px/1.1 "Nunito", sans-serif;
  letter-spacing: 0.2px; box-shadow: 0 6px 18px rgba(0,0,0,0.35); transform-origin: 50% 60%; white-space: nowrap; }
#cap b.y { color: #ffd23f; font-weight: 900; }
#cap b.g { color: #5dff8f; font-weight: 900; }
#cap b.r { color: #ff5d5d; font-weight: 900; }
.spark { position: absolute; color: #fff; font: 900 80px "Nunito"; pointer-events: none; opacity: 0;
  text-shadow: 0 0 18px rgba(255,255,255,0.9); transform-origin: 50% 50%; }
</style>
<script type="importmap">

<div id="stage">
  <canvas id="c" width="720" height="1280"></canvas>
  <div id="tint"></div>
  <div id="vig"></div>
  <div id="cap"></div>
  <div class="spark" id="sp1">&#10022;</div>
  <div class="spark" id="sp2">&#10022;</div>
</div>
<script type="module" src="/scene.js"></script>
</body>
</html>
