@property --sig{syntax:'<color>';inherits:true;initial-value:#7be1c2}
:root{
  --back:#020507; --bg:#05080b; --pane:#081017; --pane2:#0b151d;
  --fg:#dde8ee; --dim:#8497a6; --faint:#4d6170; --mute:#6c8090;
  --line:rgba(255,255,255,.065); --line2:rgba(255,255,255,.12);
  --ok:#9be36b; --warn:#ffc661; --err:#ff6f7f; --git:#b6a4ff; --env:#ffcf70; --info:#5ab8ff;
  --sig:#7be1c2; --ga:74%; --gp:42%; --blur:blur(34px) saturate(1.35);
  /* wall colours sampled from the Ghostty X screenshot: #133145 top-left to #48828c bottom-right */
  --wall:radial-gradient(760px 460px at 86% 96%,rgba(86,150,160,.55),transparent 70%),radial-gradient(700px 380px at 8% 60%,rgba(52,104,114,.5),transparent 70%),linear-gradient(140deg,#133145 0%,#1b4052 26%,#2a5661 52%,#356770 74%,#48828c 100%);
  --mono:"JBM",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.85,.2,1);
  color-scheme:dark;
}
:root[data-glass="solid"]{--ga:100%;--gp:100%}
:root[data-theme="void"]{--back:#020307;--bg:#06070c;--pane:#0a0c13;--pane2:#0d1019;--fg:#dde3f0;--dim:#838ba3;--faint:#4b5268;--mute:#6b7390;--ok:#5fe3a8;--sig:#5ab8ff;
  --wall:radial-gradient(900px 520px at 14% 30%,rgba(70,110,200,.4),transparent 62%),linear-gradient(158deg,#0a1024,#141d3c 45%,#101a30)}
:root[data-theme="graphite"]{--back:#0c0d10;--bg:#111317;--pane:#16181d;--pane2:#1a1d23;--fg:#e4e6ec;--dim:#8f94a3;--faint:#585d6c;--mute:#747a8a;--ok:#9ece6a;--sig:#ff9e64;
  --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);
  --wall:radial-gradient(900px 520px at 16% 30%,rgba(150,120,100,.28),transparent 62%),linear-gradient(158deg,#1a1b20,#26272e 45%,#1d1e24)}
:root[data-theme="phosphor"]{--back:#010402;--bg:#040906;--pane:#070d09;--pane2:#0a120d;--fg:#d3ecd9;--dim:#7b9a86;--faint:#456050;--mute:#5e7a69;--ok:#b8f560;--git:#b8f560;--sig:#5dfc9a;
  --line:rgba(160,255,200,.07);--line2:rgba(160,255,200,.14);
  --wall:radial-gradient(900px 520px at 14% 30%,rgba(60,160,100,.3),transparent 62%),linear-gradient(158deg,#06150c,#0d2a18 45%,#081a10)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{transition:--sig .6s ease}
body{background:radial-gradient(900px 420px at 18% -10%,color-mix(in srgb,var(--sig) 9%,transparent),transparent 70%),radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/22px 22px,var(--back);
  color:var(--fg);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:42px minmax(0,1fr) 26px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
b{font-weight:600}
.sp{flex:1}
.d{color:var(--dim)}.ft{color:var(--faint)}.ok{color:var(--ok)}.wn{color:var(--warn)}.er{color:var(--err)}.ac{color:var(--sig)}.fg{color:var(--fg)}

/* ───── board chrome (the design board is itself a Signal window) ───── */
.btb{display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);position:relative}
.bcap{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;height:26px;padding:0 12px 0 5px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.025);font-size:12px;white-space:nowrap}
.bcap .n{display:grid;place-items:center;height:16px;min-width:22px;border-radius:4px;font-size:10px;font-weight:700;color:var(--bg);background:var(--sig)}
.bbody{display:flex;min-height:0}
.brail{width:226px;flex:none;overflow-y:auto;padding:12px 6px 12px 10px;scrollbar-width:none;border-right:1px solid var(--line)}
.brh{font-size:10px;letter-spacing:.2em;color:var(--faint);padding:0 4px;margin:0 0 8px;display:flex;justify-content:space-between}
.brh+.brh,.btab+.brh{margin-top:14px}
.btab{display:flex;align-items:center;gap:10px;height:38px;padding:0 8px 0 9px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;width:100%;text-align:left}
.btab:hover{background:rgba(255,255,255,.035)}
.btab .ix{width:24px;height:24px;font-size:10px}
.btab .nm{font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btab.on{background:linear-gradient(90deg,color-mix(in srgb,var(--sig) 22%,transparent),color-mix(in srgb,var(--sig) 5%,transparent) 75%);border-color:color-mix(in srgb,var(--sig) 36%,transparent);box-shadow:inset 0 0 20px -8px color-mix(in srgb,var(--sig) 60%,transparent)}
.btab.on .nm{color:var(--fg)}
.btab.on .ix{background:var(--sig);border-color:var(--sig);color:var(--bg);box-shadow:0 0 18px -3px var(--sig)}
.bstage{flex:1;min-width:0;overflow:auto;padding:18px 18px 40px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.bsb{display:flex;align-items:center;gap:16px;padding:0 14px;border-top:1px solid var(--line);font-size:10.5px;letter-spacing:.05em;color:var(--faint);white-space:nowrap;overflow:hidden}
.live{display:flex;align-items:center;gap:7px;color:var(--sig);font-weight:600}
.live i{width:6px;height:6px;border-radius:50%;background:var(--sig);box-shadow:0 0 8px var(--sig)}
.thb{height:24px;padding:0 9px;border-radius:7px;border:1px solid var(--line);color:var(--dim);display:inline-flex;align-items:center;gap:7px;font-size:10.5px}
.thb i{width:8px;height:8px;border-radius:50%}
.thb[aria-pressed="true"]{color:var(--fg);border-color:color-mix(in srgb,var(--sig) 55%,transparent);background:color-mix(in srgb,var(--sig) 9%,transparent)}
.scene{display:none;max-width:1200px;margin:0 auto}
.scene.on{display:block;animation:rise .35s var(--ease)}
body.all .scene{display:block;margin-bottom:56px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.sh{display:flex;align-items:baseline;gap:12px;margin:0 2px 12px}
.sh h2{font-size:15px;font-weight:600;letter-spacing:.02em}
.sh p{font-size:11.5px;color:var(--dim)}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.note{border:1px solid var(--line);border-radius:10px;background:var(--pane);padding:11px 13px 12px;font-size:11.5px;line-height:1.6;color:var(--dim)}
.note h4{font-size:10px;letter-spacing:.2em;font-weight:500;color:var(--sig);margin-bottom:6px}
.note code,.doc code{font-family:inherit;font-size:10.5px;color:var(--fg);background:rgba(255,255,255,.05);padding:1px 5px;border-radius:4px;white-space:nowrap}
.note b,.doc b{color:var(--fg)}

/* ───── desktop ───── */
.desk{position:relative;width:1164px;margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:var(--wall);box-shadow:0 30px 80px -30px #000}
.mb{position:absolute;inset:0 0 auto 0;height:32px;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:11.5px;color:rgba(255,255,255,.82);background:rgba(0,0,0,.22)}
.mb b{font-weight:700}
.notch{position:absolute;top:0;left:50%;width:186px;height:32px;margin-left:-93px;background:#000;border-radius:0 0 9px 9px;z-index:6}
.tagl{position:absolute;font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.55);white-space:nowrap}
.dim{position:absolute;inset:0;background:rgba(2,4,6,.5);backdrop-filter:blur(7px)}

/* ───── island ───── */
.isl{position:absolute;top:0;left:50%;width:880px;margin-left:-440px;z-index:4;color:var(--fg);padding-bottom:1px;
  background:linear-gradient(#000 30px,color-mix(in srgb,var(--bg) var(--ga),transparent) 96px);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:0 0 22px 22px;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--sig) 34%,transparent),0 34px 90px -24px #000,0 0 100px -34px color-mix(in srgb,var(--sig) 60%,transparent)}
.isl::before,.isl::after{content:"";position:absolute;top:0;width:12px;height:12px}
.isl::before{left:-12px;background:radial-gradient(circle at 0 100%,transparent 11.4px,#000 12px)}
.isl::after{right:-12px;background:radial-gradient(circle at 100% 100%,transparent 11.4px,#000 12px)}
.isl .wash{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px 200px at 50% 30px,color-mix(in srgb,var(--sig) 10%,transparent),transparent 70%)}
.nav{position:absolute;top:38px;height:30px;display:flex;gap:8px;z-index:2}
.nav.lf{right:calc(50% + 62px)}.nav.rt{left:calc(50% + 62px)}
.nt{position:relative;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--dim);background:var(--bg);border:1px solid var(--line2);transition:.3s}
.nt.on{background:var(--sig);border-color:var(--sig);color:var(--bg);box-shadow:0 0 18px -3px var(--sig)}
.nt em{position:absolute;right:-3px;top:-3px;min-width:12px;height:12px;border-radius:6px;font-size:8.5px;font-weight:700;font-style:normal;display:grid;place-items:center;padding:0 3px;color:var(--bg);background:var(--warn);box-shadow:0 0 0 2px var(--bg)}
.itr{position:absolute;top:36px;right:14px;display:flex;gap:4px;z-index:2}
.ib{height:24px;min-width:24px;padding:0 6px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--dim);border:1px solid transparent;font-size:10.5px}
.ib.o{border-color:var(--line)}
.zz{position:absolute;left:50%;top:28px;width:60px;height:60px;margin-left:-30px;z-index:3}
.trace{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.trace path{fill:none;stroke-linecap:round}
.trace .t0{stroke:color-mix(in srgb,var(--sig) 45%,transparent);stroke-width:1}
.trace .t1{stroke:var(--sig);stroke-width:1.6;stroke-dasharray:14 190;animation:flow 2.2s linear infinite;filter:drop-shadow(0 0 4px var(--sig))}
@keyframes flow{to{stroke-dashoffset:-204}}

/* pane = one screen */
.pn{position:relative;z-index:2;margin:98px 14px 0;background:color-mix(in srgb,var(--pane2) var(--gp),transparent);border:1px solid color-mix(in srgb,var(--sig) 40%,transparent);border-radius:10px;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--sig) 7%,transparent),0 0 44px -16px color-mix(in srgb,var(--sig) 60%,transparent),inset 0 1px 0 color-mix(in srgb,var(--sig) 14%,transparent)}
.pn.q{background:color-mix(in srgb,var(--pane) var(--gp),transparent);border-color:var(--line);box-shadow:none}
.cn{position:absolute;width:13px;height:13px;border:0 solid var(--sig);pointer-events:none;filter:drop-shadow(0 0 4px var(--sig))}
.cn.tl{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px;border-top-left-radius:10px}
.cn.tr{top:-1px;right:-1px;border-top-width:2px;border-right-width:2px;border-top-right-radius:10px}
.cn.bl{bottom:-1px;left:-1px;border-bottom-width:2px;border-left-width:2px;border-bottom-left-radius:10px}
.cn.br{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px;border-bottom-right-radius:10px}
.port{position:absolute;top:9px;width:7px;height:7px;border-radius:50%;background:var(--sig);box-shadow:0 0 10px var(--sig)}
.port.lf{left:-4px}.port.rt{right:-4px}
.ph{height:26px;display:flex;align-items:center;gap:9px;padding:0 6px 0 13px;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.03em;color:var(--faint);white-space:nowrap}
.ph .tg{font-weight:700;color:var(--sig)}
.ph .nm{color:var(--fg);font-weight:600;letter-spacing:.08em}
.ph .ib{height:18px;min-width:20px;padding:0 4px}
.ph .ib svg{width:12px;height:12px}
.pb{padding:12px 14px 14px}
.sb{position:relative;z-index:2;height:26px;margin-top:8px;display:flex;align-items:center;gap:14px;padding:0 18px;border-top:1px solid var(--line);font-size:10.5px;letter-spacing:.05em;color:var(--faint);white-space:nowrap;overflow:hidden}
.sb b{font-weight:500;color:var(--dim)}
.sb .k{display:inline-flex;align-items:center;gap:6px}

/* ───── components ───── */
.kbd{display:inline-block;font-size:10px;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;line-height:1.4;white-space:nowrap}
.kbd.hi{color:var(--fg);border-color:color-mix(in srgb,var(--sig) 35%,transparent);background:color-mix(in srgb,var(--sig) 8%,transparent)}
.chip{--k:var(--sig);display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:500;letter-spacing:.02em;white-space:nowrap;
  color:var(--k);background:color-mix(in srgb,var(--k) 10%,transparent);border:1px solid color-mix(in srgb,var(--k) 26%,transparent)}
.chip svg{width:12px;height:12px}
.chip.n{--k:var(--dim)}.chip.g{--k:var(--ok)}.chip.w{--k:var(--warn)}.chip.e{--k:var(--err)}.chip.v{--k:var(--git)}.chip.b{--k:var(--info)}.chip.y{--k:var(--env)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--k)}
.chip i.p{animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--k,var(--sig)) 70%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.ix{--c:var(--sig);flex:none;width:27px;height:27px;display:grid;place-items:center;border-radius:8px;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.ix.f{background:var(--c);border-color:var(--c);color:var(--bg);box-shadow:0 0 18px -3px var(--c)}
.ix.lg{width:34px;height:34px;border-radius:9px}
.lbl{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.2em;color:var(--faint);margin:14px 2px 8px;white-space:nowrap}
.lbl:first-child{margin-top:2px}
.lbl b{font-weight:500;color:var(--dim);letter-spacing:.08em}.lbl .b{letter-spacing:.02em}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.r{position:relative;display:flex;align-items:center;gap:10px;min-height:46px;padding:7px 8px 7px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.018)}
.r+.r{margin-top:5px}
.r .m{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.r .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.on{background:linear-gradient(90deg,color-mix(in srgb,var(--sig) 20%,transparent),color-mix(in srgb,var(--sig) 4%,transparent) 75%);border-color:color-mix(in srgb,var(--sig) 36%,transparent);box-shadow:inset 0 0 20px -8px color-mix(in srgb,var(--sig) 60%,transparent),0 0 26px -12px color-mix(in srgb,var(--sig) 80%,transparent)}
.r.on::before{content:"";position:absolute;left:-1px;top:11px;bottom:11px;width:2px;border-radius:2px;background:var(--sig);box-shadow:0 0 10px var(--sig)}
.r.sm{min-height:36px;padding:4px 8px 4px 10px}
.b{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);color:var(--fg);font-size:11px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.03);white-space:nowrap;flex:none}
.b svg{width:12px;height:12px}
.b.p{border-color:color-mix(in srgb,var(--sig) 55%,transparent);background:color-mix(in srgb,var(--sig) 12%,transparent)}
.b.f{background:var(--sig);border-color:var(--sig);color:var(--bg);font-weight:700;box-shadow:0 0 18px -5px var(--sig)}
.b.g,.b.e,.b.w{color:var(--k);background:color-mix(in srgb,var(--k) 10%,transparent);border-color:color-mix(in srgb,var(--k) 32%,transparent)}
.b.g{--k:var(--ok)}.b.e{--k:var(--err)}.b.w{--k:var(--warn)}
.b.q{border-color:transparent;background:none;color:var(--dim)}
.b .kbd{border:0;padding:0;color:inherit;opacity:.6}
.b.sq{width:26px;padding:0;justify-content:center}
.sg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.02)}
.sg span{height:22px;padding:0 10px;border-radius:7px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);white-space:nowrap}
.sg span svg{width:12px;height:12px}
.sg .on{color:var(--fg);background:linear-gradient(90deg,color-mix(in srgb,var(--sig) 24%,transparent),color-mix(in srgb,var(--sig) 8%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sig) 38%,transparent)}
.sg.w{display:flex;flex:1}.sg.w span{flex:1;justify-content:center}
.ct{font-size:9.5px;font-weight:700;min-width:15px;height:14px;padding:0 4px;border-radius:4px;display:inline-grid;place-items:center;color:var(--dim);background:rgba(255,255,255,.07)}
.on .ct{color:var(--bg);background:var(--sig)}
.tog{flex:none;width:30px;height:16px;border-radius:5px;border:1px solid var(--line2);position:relative;background:rgba(255,255,255,.03)}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:3px;background:var(--faint)}
.tog.on{border-color:color-mix(in srgb,var(--sig) 55%,transparent);background:color-mix(in srgb,var(--sig) 14%,transparent)}
.tog.on::after{left:16px;background:var(--sig);box-shadow:0 0 8px var(--sig)}
.sel{height:26px;padding:0 8px 0 10px;border-radius:7px;border:1px solid var(--line2);font-size:11px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);flex:none}
.sel svg{width:10px;height:10px;color:var(--dim)}
.fld{height:28px;flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:11.5px;color:var(--faint)}
.fld svg{color:var(--dim)}
/* the bracketed input block from the Ghostty X prompt */
.in{position:relative;padding:10px 14px 11px 16px;border-radius:9px;background:color-mix(in srgb,var(--sig) 4%,transparent)}
.in .cn{width:11px;height:11px;filter:none;border-radius:0!important}
.in .cn.tl,.in .cn.bl{left:0}.in .cn.tr,.in .cn.br{right:0}.in .cn.tl,.in .cn.tr{top:0}.in .cn.bl,.in .cn.br{bottom:0}
.in .cn.tl{border-top-left-radius:6px!important}.in .cn.tr{border-top-right-radius:6px!important}.in .cn.bl{border-bottom-left-radius:6px!important}.in .cn.br{border-bottom-right-radius:6px!important}
.in .l1{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.2em;color:var(--sig);margin-bottom:6px}
.in .l1 span{color:var(--faint);letter-spacing:.06em}
.in .l2{display:flex;align-items:center;min-height:20px;font-size:13px}
.in .l2 .ph2{color:var(--faint)}
.in .hint{margin-left:auto;padding-left:14px;flex:none;display:flex;gap:14px;font-size:10px;letter-spacing:.14em;color:var(--faint);white-space:nowrap}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:10px}
.bars i{width:2px;background:var(--sig);border-radius:1px}
.car{flex:none;width:9px;height:12px;margin-right:9px;color:var(--sig);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--sig) 80%,transparent))}
.car path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cur{display:inline-block;flex:none;width:8px;height:16px;margin-left:1px;border-radius:1.5px;background:var(--sig);box-shadow:0 0 12px color-mix(in srgb,var(--sig) 85%,transparent);animation:blink 1.2s ease-in-out infinite;vertical-align:-3px}
@keyframes blink{0%,50%{opacity:1}65%,90%{opacity:.18}}
.new{height:38px;border-radius:10px;border:1px dashed var(--line2);color:var(--dim);display:flex;align-items:center;gap:12px;padding:0 14px;font-size:12px;white-space:nowrap}
.new .kbd{margin-left:auto;border:0}
.spark{height:18px;width:100%;display:block}
.spark polyline{fill:none;stroke:var(--sig);stroke-width:1.2;vector-effect:non-scaling-stroke}
.bar{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;min-width:20px}
.bar i{display:block;height:100%;background:var(--sig);border-radius:2px;box-shadow:0 0 8px var(--sig)}
.tele{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 11px 10px;background:rgba(255,255,255,.018)}
.tele .k{font-size:10px;letter-spacing:.2em;color:var(--faint);display:flex;justify-content:space-between}
.tele .v{font-size:19px;font-weight:600;margin:5px 0 7px;letter-spacing:-.01em}
.tele .v small{font-size:10.5px;font-weight:400;color:var(--dim);margin-left:4px;letter-spacing:.02em}
.blk{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.018);overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;min-height:28px;padding:0 10px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.bh .tgk{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.code{font-size:11.5px;line-height:1.62;color:var(--dim);padding:8px 12px 10px;white-space:pre-wrap}
.ln{display:flex;gap:12px;font-size:11.5px;line-height:1.75;white-space:nowrap}
.ln>span:first-child{color:var(--faint)}
.av{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:var(--bg);background:var(--c,var(--git));margin-left:2px}
.cb{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--faint)}
.cb.on{border-color:var(--sig);background:var(--sig)}
table.tb{width:100%;border-collapse:collapse;font-size:10.5px}
table.tb th{font-weight:500;font-size:9.5px;letter-spacing:.16em;color:var(--faint);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
table.tb td{padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.035);color:var(--dim);white-space:nowrap}
table.tb td.t{color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb{flex:none;width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:linear-gradient(135deg,#3b7f86,#1b3a52)}

/* floating surfaces outside the island */
.fl{position:absolute;color:var(--fg);background:color-mix(in srgb,var(--bg) var(--ga),transparent);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid color-mix(in srgb,var(--sig) 36%,transparent);border-radius:12px;
  box-shadow:0 26px 70px -20px #000,0 0 70px -28px color-mix(in srgb,var(--sig) 60%,transparent)}
.wing{position:absolute;top:0;height:44px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);display:flex;align-items:center;gap:9px;padding:0 12px;font-size:11px;color:var(--fg);z-index:5;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--k,var(--sig)) 40%,transparent),0 0 40px -14px var(--k,var(--sig))}
.wing.lf{right:calc(50% + 93px);border-radius:0 0 0 12px;padding-right:16px;background:linear-gradient(to left,#000 30%,color-mix(in srgb,var(--bg) 82%,transparent))}
.wing.rt{left:calc(50% + 93px);border-radius:0 0 12px 0;padding-left:16px;background:linear-gradient(to right,#000 30%,color-mix(in srgb,var(--bg) 82%,transparent))}
.strip{position:relative;height:150px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--wall)}

/* docs */
.doc{border:1px solid var(--line);border-radius:10px;background:var(--pane);padding:14px 16px;font-size:11.5px;line-height:1.65;color:var(--dim)}
.doc h3{font-size:10px;letter-spacing:.2em;font-weight:500;color:var(--sig);margin-bottom:9px}
.doc+.doc{margin-top:10px}
.doc table{width:100%;border-collapse:collapse}
.doc td,.doc th{padding:5px 10px 5px 0;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:top;text-align:left}
.doc th{font-size:9.5px;letter-spacing:.16em;font-weight:500;color:var(--faint)}
.doc tr:last-child td{border-bottom:0}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:7px;border:1px solid var(--line2)}
.opt{border:1px solid var(--line);border-radius:10px;background:var(--pane);padding:14px;position:relative}
.opt.rec{border-color:color-mix(in srgb,var(--sig) 45%,transparent);box-shadow:0 0 44px -20px var(--sig)}
.opt h5{font-size:12.5px;font-weight:600;margin:10px 0 4px}
.opt p{font-size:11px;line-height:1.55;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.trace .t1{display:none}}

/* ───── Zera ───── */
.zera .zs{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.zera .zf,.zera .zb,.zdots circle{fill:currentColor}
.zera .face{filter:drop-shadow(0 0 3px currentColor)}
.zera .body{filter:drop-shadow(0 0 7px color-mix(in srgb,currentColor 55%,transparent))}
.zera .zb{transform-box:fill-box;transform-origin:center;animation:zblink 4.6s infinite}
@keyframes zblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.zera .za{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;opacity:.85}
.zera .zh{fill:#0a1218;stroke:currentColor;stroke-width:1.6}
.zera.vb .face{color:#2a1c28;filter:none}
.zera.vb .za{stroke:#f58a45;opacity:1}.zera.vb .zh{fill:#ffab4c;stroke:none}
.zera.vb .body{filter:drop-shadow(0 0 8px rgba(255,160,70,.5))}
.zera.vc .zh{fill:none}
.zdots circle{animation:blink 1.2s infinite}
.zdots circle:nth-child(2){animation-delay:.2s}.zdots circle:nth-child(3){animation-delay:.4s}

/* settings + misc */
.set{display:flex;align-items:center;gap:12px;min-height:42px;border-bottom:1px solid var(--line);font-size:12px}
.set .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.set .m b{font-weight:600}.set .m span{font-size:10.5px;color:var(--dim)}
.sld{position:relative;width:150px;height:3px;border-radius:2px;background:var(--line2);flex:none}
.sld i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--sig)}
.sld b{position:absolute;top:-5px;width:9px;height:13px;border-radius:3px;background:var(--sig);box-shadow:0 0 10px var(--sig);margin-left:-4px}
.swb{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;border:1px solid var(--line);font-size:10.5px;color:var(--dim)}
.swb i{width:8px;height:8px;border-radius:50%}
.swb.on{color:var(--fg);border-color:color-mix(in srgb,var(--sig) 55%,transparent);background:color-mix(in srgb,var(--sig) 9%,transparent)}
.deckt{position:absolute;top:40px;width:300px;display:flex;gap:10px;align-items:flex-start}
.dnav{position:absolute;left:24px;right:24px;top:104px;display:flex;justify-content:space-between}
.dnav span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--dim);width:70px;letter-spacing:.02em}
.dnav .nt{width:34px;height:34px;border-radius:9px}
.dnav>.on{color:var(--fg)}
.logr{display:grid;grid-template-columns:70px 46px 92px 1fr auto;gap:0 10px;align-items:center;min-height:30px;padding:0 10px;font-size:11.5px;border-bottom:1px solid rgba(255,255,255,.04)}
.logr:last-child{border-bottom:0}
.gl{display:flex;gap:3px;align-items:center}
.gl i{width:7px;height:13px;border-radius:2px;border:1px solid color-mix(in srgb,var(--info) 50%,transparent)}
.gl i.f{background:var(--info);box-shadow:0 0 6px var(--info)}
@media (max-width:1380px){.btb>.ft{display:none}}
@media (max-width:1180px){.bcap{display:none}.notes{grid-template-columns:1fr}}
.isl .ib.on.nt{background:var(--sig);border-color:var(--sig);color:var(--bg);box-shadow:0 0 18px -3px var(--sig)}
.nogap>.r{margin-top:0}
table.tb td.ok{color:var(--ok)}table.tb td.wn{color:var(--warn)}

/* ───── wings: the app's own silhouette (pill + tendril into Zera), Signal finish ───── */
.wg{position:absolute;left:50%;top:36px;height:60px;z-index:5}
.wg>svg{position:absolute;left:0;top:0;overflow:visible}
.wgb{position:absolute;top:0;bottom:0;background:linear-gradient(color-mix(in srgb,var(--pane2) 84%,transparent),color-mix(in srgb,var(--bg) 88%,transparent));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.wg .we{fill:none;stroke:var(--k);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:16 640;animation:wflow 2.2s linear infinite;filter:drop-shadow(0 0 4px var(--k))}
@keyframes wflow{from{stroke-dashoffset:16}to{stroke-dashoffset:-640}}
.wgc{position:absolute;top:0;height:60px;display:flex;align-items:center;gap:10px;font-size:11px;white-space:nowrap;color:var(--fg)}
.wgc.lf{padding:0 12px 0 17px}.wgc.rt{padding:0 17px 0 12px}
.wgz{position:absolute;top:3px;width:54px;height:54px}
.ib.rd{width:26px;height:26px;border-radius:50%;border-color:var(--line2);background:rgba(255,255,255,.03)}
.sorb{flex:none;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--k) 55%);box-shadow:0 0 10px var(--k)}

/* ───── edge light ───── */
.el{position:absolute;inset:0;pointer-events:none;z-index:7;--ev:var(--sig)}
.el>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.el path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.el .nf{fill:#000;stroke:none}
.el .q{stroke:color-mix(in srgb,var(--sig) 42%,transparent);stroke-width:1}
.el .bl{stroke:var(--ev);stroke-width:18;opacity:0;filter:blur(8px)}
.el .a0{stroke:var(--ev);stroke-width:1.4;opacity:0}
.el .a1{stroke:var(--ev);stroke-width:2.6;opacity:0;filter:drop-shadow(0 0 5px var(--ev)) drop-shadow(0 0 14px var(--ev))}
.el .hot{stroke:#fff;stroke-width:1;opacity:0}
.el .g1{stroke:#ff4f8b;stroke-width:2;opacity:0;mix-blend-mode:screen}
.el .g2{stroke:#3fe9ff;stroke-width:2;opacity:0;mix-blend-mode:screen}
.el .bk{stroke:var(--ev);stroke-width:2;opacity:0;filter:drop-shadow(0 0 5px var(--ev))}
.el .sl{position:absolute;top:0;background:var(--ev);opacity:0;box-shadow:0 0 10px var(--ev)}
.el .lv{position:absolute;top:0;height:3px;width:0;box-shadow:0 0 12px var(--ev),0 0 3px var(--ev);transition:width .22s steps(7,end),opacity .3s;opacity:0}
.el .lv.lf{background:repeating-linear-gradient(to left,var(--ev) 0 11px,transparent 11px 14px)}
.el .lv.rt{background:repeating-linear-gradient(to right,var(--ev) 0 11px,transparent 11px 14px)}
.el .tk{position:absolute;top:4px;height:5px;opacity:0;transition:opacity .3s;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ev) 70%,transparent) 0 1px,transparent 1px 14px)}
.el .tk.lf{-webkit-mask:linear-gradient(to left,#000,transparent);mask:linear-gradient(to left,#000,transparent)}
.el .tk.rt{-webkit-mask:linear-gradient(to right,#000,transparent);mask:linear-gradient(to right,#000,transparent)}
.el .ro{position:absolute;top:40px;font-size:10px;letter-spacing:.16em;color:var(--ev);opacity:0;transition:opacity .25s,left .22s steps(7,end);white-space:nowrap;text-shadow:0 0 8px var(--ev)}
.el .mic{position:absolute;top:3px;width:66px;height:15px;display:flex;align-items:flex-start;gap:3px;opacity:0;transition:opacity .25s}
.el .mic i{flex:1;background:var(--ev);border-radius:0 0 1.5px 1.5px;box-shadow:0 0 6px var(--ev);animation:micb .7s steps(4) infinite alternate}
@keyframes micb{from{height:20%}to{height:100%}}
.el.drag .a0{opacity:.95;stroke-dasharray:7 6;animation:ants .6s linear infinite,breathe 1.8s ease-in-out infinite}
@keyframes ants{to{stroke-dashoffset:-13}}
@keyframes breathe{50%{opacity:.45}}
.el.mic-on .a0{opacity:.85}.el.mic-on .mic{opacity:1}
.el.drag .a0,.el.mic-on .a0{stroke-width:2;filter:drop-shadow(0 0 4px var(--ev))}
.el.hold .a0{opacity:.42}
.pg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.pg .lb{font-size:10px;letter-spacing:.2em;color:var(--faint);margin:0 4px 0 8px}
.pg .lb:first-child{margin-left:2px}
.pg button{height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);font-size:11px;background:rgba(255,255,255,.03);display:inline-flex;align-items:center;gap:7px}
.pg button:hover{border-color:color-mix(in srgb,var(--sig) 55%,transparent)}
.pg button[aria-pressed="true"]{border-color:color-mix(in srgb,var(--sig) 55%,transparent);background:color-mix(in srgb,var(--sig) 12%,transparent)}
.pg button i{width:7px;height:7px;border-radius:50%}
.efg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ef{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--pane)}
.ef svg{display:block;width:100%;height:auto;background:var(--wall)}
.ef div{padding:8px 10px 9px;font-size:10.5px;line-height:1.5;color:var(--dim)}
.ef b{display:block;font-size:10px;letter-spacing:.18em;font-weight:500;color:var(--fg);margin-bottom:2px}

  const run = (node, frames, opt) => node.animate(frames, Object.assign({ fill: 'none' }, opt));
  const stutter = 'steps(6,jump-none)';
  function tear(dur, o0, o1, ease) {

      const spots = Array.from({ length: 6 }, () => Math.random() * (EG.W - w));
      run(s, spots.map(x => ({ left: x + 'px', opacity: Math.random() > .45 ? .9 : 0 })).concat([{ opacity: 0 }]), { duration: 420 + i * 70, easing: 'steps(7,jump-none)' }); });

    const w = reach === 'notch' ? 60 * v : ARM * v, lf = $('.lv.lf', el), rt = $('.lv.rt', el), ro = $('.ro', el);
    lf.style.right = (EG.W - ARM) + 'px'; rt.style.left = (EG.W - ARM) + 'px';
    [lf, rt].forEach(a => { a.style.opacity = 1; a.style.width = w + 'px'; });
    $$('.tk', el).forEach((t, i) => { t.style.opacity = reach === 'notch' ? 0 : .7; t.style.width = ARM + 'px'; t.style[i ? 'left' : 'right'] = (EG.W - ARM) + 'px'; });
    ro.textContent = label; ro.style.opacity = 1; ro.style.left = Math.min(EG.W - 80, EG.W - ARM + w + 10) + 'px';
    P('a0').forEach(p => { p.style.strokeDasharray = '120 1000'; run(p, [{ opacity: .9 }, { opacity: .9, offset: .8 }, { opacity: 0 }], { duration: 1900 }); });
    lvT = setTimeout(() => { [lf, rt].forEach(a => a.style.opacity = 0); $$('.tk', el).forEach(t => t.style.opacity = 0); ro.style.opacity = 0; }, 1700);
  }
  function sustain(key) {
    const was = sus; el.classList.remove('drag', 'mic-on', 'hold'); sus = null;
    P('a0').forEach(p => p.style.strokeDasharray = '');
    if (was === key) return false;
    el.classList.add({ drag: 'drag', mic: 'mic-on', mod: 'hold' }[key]); sus = key; return true;
  }
  const RN = {"agent": ".agentArrival", "approval": ".approvalNeeded", "done": ".success", "failed": ".danger", "copy": ".copy", "paste": ".paste", "cut": ".cut", "save": ".save", "caps": ".capsLock(on: true)", "vol": ".level(.volume, 0.62)", "mute": ".level(.mute, nil)", "bat": ".level(.battery, 0.78)", "drag": ".fileDrag(active: true)", "mic": ".listening(active: true)", "mod": ".modifier(held: true)"};
  const EV = {
    agent: [C.info, 'AGENT ARRIVES', 'A pulse leaves the notch both ways and runs the edge.', () => sweep(false), 'think'],
    approval: [C.warn, 'NEEDS APPROVAL', 'Two flashes. In the app the line then stays amber until you answer.', () => flash(2), 'warn'],
    done: [C.ok, 'DONE', 'A green pulse runs to the corners and fades.', () => sweep(false), 'ok'],
    failed: [C.err, 'FAILED', 'One red flash with a short tear.', () => flash(1), 'err'],
    copy: [C.fg, '⌘C COPY', 'A white pulse sweeps out once the clipboard has changed.', () => sweep(false)],
    paste: [C.sig, '⌘V PASTE', 'The pulse runs back into the notch.', () => sweep(true)],
    cut: [C.err, '⌘X CUT', 'One red flash.', () => flash(1)],
    save: [C.ok, '⌘S SAVE', 'One clean green flash.', () => flash(1)],
    caps: [C.ok, 'CAPS LOCK', 'Twice on, once quietly off.', () => flash(2)],
    vol: [C.sig, 'VOLUME', 'The line steps out from the notch. Its reach is the level.', () => level(.62, 'VOL 62')],
    mute: [C.err, 'MUTE', 'The arms pull back and the outline goes red.', () => { level(0, 'MUTE'); flash(1); }],
    bat: [C.ok, 'CHARGING', 'The line fills green to the charge level.', () => level(.78, 'BAT 78')],
    drag: [C.warn, 'FILE DRAG', 'Dashes march along the edge until the drop. Press again to drop.', () => sustain('drag')],
    mic: [C.vio, 'LISTENING', 'Violet while the microphone is open. Press again to stop.', () => sustain('mic')],
    mod: [C.sig, '⌘ HELD', 'A faint steady line while the key is down. Press again to release.', () => sustain('mod')]
  };
  function fire(k) {
    const e = EV[k]; if (!e) return;
    if (sus && !['drag', 'mic', 'mod'].includes(k)) sustain(sus);   // the preview shows one thing at a time
    el.style.setProperty('--ev', e[0]); cap(e[1], e[2], RN[k]); e[3]();
    $('#elz').innerHTML = zera({ s: 46, m: e[4] || 'idle' });
  }
  window.__fire = fire; window.__edge = o => { if (o.look) look = o.look; if (o.reach) reach = o.reach; if (o.enter) enter = o.enter; geometry(); };
  const stop = () => { clearInterval(auto); auto = null; };
  $$('#pg button').forEach(b => b.onclick = () => {
    stop(); const k = b.dataset.look ? 'look' : b.dataset.reach ? 'reach' : 'enter', v = b.dataset[k];
    if (k === 'look') look = v; else if (k === 'reach') reach = v; else enter = v;
    $$(`#pg [data-${k}]`).forEach(x => x.setAttribute('aria-pressed', x === b)); geometry(); fire('agent');
  });
  $$('[data-ev]').forEach(b => b.onclick = () => { stop(); fire(b.dataset.ev); });
  geometry();
  if (!reduce) { let i = 0; const seq = ['agent', 'copy', 'vol', 'approval', 'done', 'paste', 'caps']; auto = setInterval(() => { if ($('#s-edge').offsetParent) fire(seq[i++ % seq.length]); }, 2600); }
};
