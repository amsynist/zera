name: CI

# Every push to main and every pull request: build, run the tests, and assemble the app so a
# broken bundle never reaches a release. The built app is attached to the run for a quick try.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # tags + history → version and build number

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true
          swift --version

      - name: Test
        run: swift test

      - name: Build Zera.app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Zera-${{ github.sha }}
          path: dist/Zera.app
          retention-days: 7
