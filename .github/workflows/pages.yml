# Publishes the landing page in site/ to GitHub Pages, served at https://zera.pravincodes.in/
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pages deploys by looking up the artifact through the Actions API.
          # The upload can finish before the artifact appears in that listing.
          for attempt in {1..15}; do
            if available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq 'any(.artifacts[]; .name == "github-pages" and (.expired | not))') && [ "$available" = true ]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The uploaded Pages artifact is still missing from the Actions API."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
