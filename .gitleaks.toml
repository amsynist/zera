# Secret-scanning config (gitleaks). Uses the default rules, plus allow-lists for known non-secrets.
[extend]
useDefault = true

[allowlist]
description = "Known non-secrets"
regexes = [
  # UserDefaults key names in ReminderService (an older revision named them *Key, which looks like a credential to the scanner)
  '''zera\.reminders\.(breakInterval|fired\.v2|snoozes\.v2|calendarWanted)''',
  # Obviously fake key used to test masking
  '''sk-ant-EXAMPLE-NOT-A-REAL-KEY-h7Qa''',
]
